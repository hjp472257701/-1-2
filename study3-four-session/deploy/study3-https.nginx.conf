server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 101.34.238.243;
    ssl_certificate /etc/letsencrypt/live/study3-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study3-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/study3-project-navigation.conf;
    location = /study3 { return 302 /study3/; }
    location ^~ /study3/ {
        proxy_pass http://127.0.0.1:8785;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20k;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
