# Shared management and navigation only. Old API routes remain on the original app.
location = /admin {
    proxy_pass http://127.0.0.1:8785;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /studies {
    proxy_pass http://127.0.0.1:8785;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /studies/ {
    proxy_pass http://127.0.0.1:8785;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
